[project]
name = "kg-ontology-decision-framework"
version = "0.1.0"
description = "Neo4j ingestion tooling for the verified CWNU curriculum knowledge graph"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neo4j>=6.2.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
